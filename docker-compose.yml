# Builds from this working copy — for developing on the image itself.
# To deploy the image built by CI instead, use deploy/docker-compose.yml.

services:
  forklift:
    build: .
    image: forklift:local
    container_name: forklift
    restart: unless-stopped
    ports:
      # LAN only. Put a Cloudflare tunnel in front of this if you want it from
      # outside the house — and use Cloudflare Access, the app has no auth.
      - "8080:8080"
    volumes:
      - forklift-data:/data
    environment:
      TZ: Europe/Copenhagen

volumes:
  forklift-data:
